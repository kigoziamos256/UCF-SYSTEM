{% extends 'base.html' %}

{% block title %}Security Check{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow text-center">
                <div class="card-body">
                    <i class="bi bi-shield-lock" style="font-size: 3rem; color: var(--brand-purple);"></i>
                    <h4 class="mt-3">Session Expired</h4>
                    <p class="text-muted">Your session has expired for security reasons. Please reload the page.</p>
                    <a href="/" class="btn text-white" style="background-color: var(--brand-purple);">
                        Reload Page
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
