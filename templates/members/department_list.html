{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">Departments</h2>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
            </tr>
        </thead>
        <tbody>
            {% for dept in departments %}
            <tr>
                <td>{{ dept.id }}</td>
                <td>{{ dept.name }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2" class="text-center">No departments created yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'create_department' %}" class="btn btn-primary mt-3">Create New Department</a>
</div>
{% endblock %}
