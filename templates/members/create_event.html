{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Create Event</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            {{ form.as_p }}
        </div>

        <button type="submit" class="btn btn-primary">
            Create Event
        </button>

        <a href="{% url 'dashboard' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
