services:
  - type: web
    name: ucf-church-system
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: "./build.sh"
    startCommand: "gunicorn ucf.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ucf-church-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: ucf-church-db
    plan: free